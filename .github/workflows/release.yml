name: Release installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python -m venv .venv
      - run: .\.venv\Scripts\python.exe -m pip install --upgrade pip
      - run: .\.venv\Scripts\python.exe -m pip install -e './services/api[package]'
      - run: npm.cmd ci
      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $Compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $Compiler)) {
            choco install innosetup --yes --no-progress
          }
      - run: .\scripts\build-windows-installer.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: lm-atelier-windows-installer
          path: release/LM-Atelier-Setup-*-windows-x86_64.exe
          if-no-files-found: error

  linux-installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --upgrade pip
      - run: .venv/bin/python -m pip install -e './services/api[package]'
      - run: npm ci
      - run: ./scripts/build-linux-installer.sh
      - uses: actions/upload-artifact@v7
        with:
          name: lm-atelier-linux-installer
          path: release/LM-Atelier-Setup-*-linux-x86_64.run
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-installer, linux-installer]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: lm-atelier-*-installer
          merge-multiple: true
          path: release
      - name: Create checksums
        run: |
          cd release
          sha256sum LM-Atelier-Setup-* > SHA256SUMS
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
