version: 2
# Keep update PRs stable between monthly reviews. Maintainers refresh and run
# the complete local verification matrix before merging a grouped update.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    open-pull-requests-limit: 5
    rebase-strategy: disabled
    groups:
      web-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      web-major-upgrades:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: uv
    directory: /services/api
    schedule:
      interval: monthly
    target-branch: develop
    open-pull-requests-limit: 5
    rebase-strategy: disabled
    groups:
      api-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      api-major-upgrades:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    open-pull-requests-limit: 3
    rebase-strategy: disabled
    groups:
      workflow-actions:
        patterns: ["*"]
