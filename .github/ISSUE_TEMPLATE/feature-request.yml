name: Feature request
description: Suggest an improvement to LM Atelier.
title: "[Idea]: "
labels: []
assignees: []
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this idea.
          required: true
        - label: This request contains no credentials or private user data.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the desired behavior, not only its visual form.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
