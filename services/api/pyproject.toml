[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "lm-atelier-api"
description = "LM Atelier control plane"
dynamic = ["version"]
license = "Apache-2.0"
authors = [{ name = "LM Atelier contributors" }]
maintainers = [{ name = "ajccarlson" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "huggingface-hub>=1.25.1,<2",
  "httpx>=0.28,<1",
  "keyring>=25,<26",
  "pydantic-settings>=2.10,<3",
  "pillow>=12.3,<13",
  "python-multipart>=0.0.20,<1",
  "psutil>=7,<8",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.51.0,<1",
  "websockets>=16.1.1,<17"
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "cyclonedx-bom>=7.3,<8",
  "httpx2>=2.7,<3",
  "mypy>=2.3.0,<3",
  "pip-audit>=2.10,<3",
  "pyyaml>=6.0.3,<7",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.12,<1",
  "types-psutil>=7.0,<8"
]
package = [
  "pyinstaller>=6.21,<7"
]

[project.urls]
Homepage = "https://github.com/ajccarlson/lm-atelier"
Issues = "https://github.com/ajccarlson/lm-atelier/issues"
Repository = "https://github.com/ajccarlson/lm-atelier.git"

[project.scripts]
lm-atelier = "local_lm.desktop:main"
local-lm = "local_lm.main:run"

[tool.hatch.version]
path = "local_lm/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["local_lm"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]
