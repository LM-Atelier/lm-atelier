[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lm-atelier-api"
version = "0.1.6"
description = "LM Atelier control plane"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "huggingface-hub>=0.33,<1",
  "httpx>=0.28,<1",
  "keyring>=25,<26",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "psutil>=7,<8",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
  "websockets>=15,<16"
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "httpx2>=2.7,<3",
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-psutil>=7.0,<8"
]
package = [
  "pillow>=11.3,<12",
  "pyinstaller>=6.21,<7"
]

[project.scripts]
lm-atelier = "local_lm.desktop:main"
local-lm = "local_lm.main:run"

[tool.hatch.build.targets.wheel]
packages = ["local_lm"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]
